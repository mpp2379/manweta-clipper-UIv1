services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: manweta_clipper
    ports:
      - "5432:5432"
    volumes:
      - clipper-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/manweta_clipper
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - clipper-uploads:/srv/backend/static/uploads
      - clipper-outputs:/srv/backend/static/outputs

volumes:
  clipper-db-data:
  clipper-uploads:
  clipper-outputs:
